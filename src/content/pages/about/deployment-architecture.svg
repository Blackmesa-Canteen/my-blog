<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 770" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif" role="img" aria-label="Deployment architecture: a contributor opens a pull request on GitHub, GitHub Actions runs a secret scan and dependency audit, merging into main triggers Cloudflare Workers Builds which runs npm run build (Astro plus Pagefind) and wrangler deploy, publishing static assets to a Cloudflare Worker served from Cloudflare's edge network to the visitor's browser; every open pull request also gets its own preview deployment.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b4513"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="770" fill="#fefbf3"/>

  <!-- 1. Contributor -->
  <rect x="180" y="16" width="280" height="56" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">Contributor</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#8a7256">git push feature branch, gh pr create</text>

  <line x1="320" y1="72" x2="320" y2="104" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. GitHub repo + Actions -->
  <rect x="80" y="108" width="480" height="122" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="320" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">GitHub — Blackmesa-Canteen/my-blog</text>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#8a7256">main is protected — merge only via reviewed PR</text>

  <rect x="110" y="162" width="420" height="52" rx="6" fill="#fefbf3" stroke="#cd853f" stroke-width="1.5"/>
  <text x="320" y="182" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8b4513">GitHub Actions — security.yml (required checks)</text>
  <text x="320" y="200" text-anchor="middle" font-size="11.5" fill="#8a7256">gitleaks secret scan · npm audit --audit-level=high</text>

  <line x1="320" y1="230" x2="320" y2="262" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="250" font-size="11.5" fill="#8a7256">checks pass → merge to main</text>

  <!-- 2b. Preview branch (dashed, off to the side) -->
  <path d="M 560 169 C 610 169, 610 340, 560 340" fill="none" stroke="#cd853f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="470" y="340" width="150" height="50" rx="8" fill="#fefbf3" stroke="#cd853f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="545" y="360" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b4513">Every open PR</text>
  <text x="545" y="376" text-anchor="middle" font-size="10.5" fill="#8a7256">gets a preview URL</text>

  <!-- 3. Cloudflare Workers Builds -->
  <rect x="60" y="266" width="400" height="122" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="260" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">Cloudflare Workers Builds</text>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#8a7256">Git integration watches main</text>

  <rect x="90" y="320" width="170" height="52" rx="6" fill="#fefbf3" stroke="#cd853f" stroke-width="1.5"/>
  <text x="175" y="340" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b4513">Build</text>
  <text x="175" y="356" text-anchor="middle" font-size="10.5" fill="#8a7256">npm run build</text>
  <text x="175" y="368" text-anchor="middle" font-size="10.5" fill="#8a7256">(astro build + pagefind)</text>

  <line x1="260" y1="346" x2="290" y2="346" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="320" width="150" height="52" rx="6" fill="#fefbf3" stroke="#cd853f" stroke-width="1.5"/>
  <text x="365" y="340" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8b4513">Deploy</text>
  <text x="365" y="356" text-anchor="middle" font-size="10.5" fill="#8a7256">wrangler deploy</text>
  <text x="365" y="368" text-anchor="middle" font-size="10.5" fill="#8a7256">(wrangler.jsonc)</text>

  <line x1="260" y1="388" x2="260" y2="420" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Cloudflare Worker static assets -->
  <rect x="60" y="424" width="400" height="78" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="260" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">Cloudflare Worker — static assets</text>
  <text x="260" y="470" text-anchor="middle" font-size="12" fill="#8a7256">dist/ (Astro HTML/CSS/JS + Pagefind search index)</text>
  <text x="260" y="486" text-anchor="middle" font-size="11.5" fill="#8a7256">no app server, no database</text>

  <line x1="260" y1="502" x2="260" y2="534" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Cloudflare edge network -->
  <rect x="60" y="538" width="400" height="60" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="260" y="564" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">Cloudflare global edge network</text>
  <text x="260" y="584" text-anchor="middle" font-size="12" fill="#8a7256">serves 996workers.org from the nearest PoP</text>

  <line x1="260" y1="598" x2="260" y2="630" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Visitor -->
  <rect x="130" y="634" width="260" height="56" rx="8" fill="#faf6e9" stroke="#8b4513" stroke-width="2"/>
  <text x="260" y="658" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2116">Visitor's browser</text>
  <text x="260" y="676" text-anchor="middle" font-size="12" fill="#8a7256">static HTML + client-side Pagefind search</text>

  <text x="320" y="740" text-anchor="middle" font-size="11.5" fill="#8a7256">Content is Markdown checked into this repo — there is no CMS or backend to keep running.</text>
</svg>
